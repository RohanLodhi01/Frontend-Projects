<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card UI Design</title>
    <!-- style css -->
    <link rel="stylesheet" href="style.css">

    <!-- boxicons css -->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>

</head>

<body>
    <div class="container">
        <div class="profile-card">
            <img src="./img/cover.png" alt="" class="cover-pic">
            <img src="./img/profile.png" alt="" class="profile-pic">
            <h1>Brie Larson</h1>
            <p>Social Media Influencer , Tik Tok</p>
            <a href="" class="follow-btn">Follow</a>

            <div class="row">
                <div>
                    <p>Followers</p>
                    <h2>1.24M</h2>
                </div>
                <div>
                    <p>Following</p>
                    <h2>120</h2>
                </div>
                <div>
                    <p>Videos</p>
                    <h2>210</h2>
                </div>
            </div>
            <a href="#" class="view-btn">View Profile</a>
        </div>
    </div>
</body>

</html>

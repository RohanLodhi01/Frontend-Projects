    <!-- tutorial code -->

    <div class="container">
        <div class="header">
            <h1>Login to CodeAcademy</h1>
        </div>
        <form action="" id="form">
            <label for="">Email or Username</label>
            <input type="text" name="" id="user-email" placeholder="Enter email or username">
            <small id="email-error"></small>
            <label for="">Password</label>
            <input type="password" name="" id="user-password" placeholder="enter password">
            <small id="password-error"></small>
            <a href="#">I forgot my password</a>
            <input type="submit" id="loginBtn" value="Log In">
        </form>
        <div class="footer">
            <h3>Login with another account</h3>
            <div class="images">
                <img src="images/facebook_logo.png" alt="">
                <img src="images/twitter.jpg" alt="">
                <img src="images/google.svg" alt="">
                <img src="images/github_logo.png" alt="">
                <img src="images/linkdin.png" alt="">
            </div>
            <a href="#">Not a member yet? <strong>Sign up free</strong></a>
        </div>

    </div>
    <script src="script.js" defer async="false"></script>
</body>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"
        rel="stylesheet">
    <title>CODECADEMY | LOGIN PAGE</title>
</head>

<body>
    <main>
        <form class="form-container" action="">
            <h1 class="heading">Log in to Codecademy</h1>
            <div class="form-input">
                <div class="email-username input-container">
                    <h3>Email or Username</h3>
                    <div class="input-field">
                        <input type="text">
                    </div>
                </div>
                <div class="password input-container">
                    <h3>Password</h3>
                    <div class="input-field">
                        <input type="text">
                    </div>
                </div>
            </div>
            <div class="login-container">
                <span>I forgot my passwordf</span>
                <div class="login-btn">
                    <a href="">Log In</a>
                </div>
                <div class="login_anohter_account">
                    <span>Login with another Account</span>
                </div>
            </div>
            <div class="social-media-handles">
                <div class="img-box">
                    <img src="images/linkdin.png" alt="">
                </div>
                <div class="img-box"><img src="images/facebook_logo.png" alt=""></div>
                <div class="img-box"><img src="images/github_logo.png" alt=""></div>
                <div class="img-box">
                    <img src="images/google.svg" alt="">
                </div>
                <div class="img-box"><img src="images/twitter.jpg" alt=""></div>
            </div>
            <div class="sign-up">
                <a  href="">Not a member yet?<strong>Sign up free</strong></a>
            </div>
            
        </form>
    </main>
</body>

</html>
